# WORKSPACE ROOT: tells Cargo (Rust's build tool) that this project is made of two crates
# (ledger-core and ledger-server) and sets the version, license and release-build options for both.

[workspace]
resolver = "2"
members = ["crates/ledger-core", "crates/ledger-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["John Yobah"]

[profile.release]
lto = true
codegen-units = 1
strip = true
