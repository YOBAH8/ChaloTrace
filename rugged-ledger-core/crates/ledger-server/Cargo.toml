# CRATE MANIFEST for ledger-server: the web server. Lists the HTTP framework (axum) and async runtime (tokio)
# it needs, plus test-only helpers.

[package]
name = "ledger-server"
description = "HTTP ingest + public verification API for the ChaloTrace ledger."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ledger-core = { path = "../ledger-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
